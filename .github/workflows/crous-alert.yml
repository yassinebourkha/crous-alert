name: Alertes CROUS

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Vérifier le site sans envoyer de message Telegram'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - main.py
      - requirements.txt
      - tests/**
      - .github/workflows/crous-alert.yml

permissions:
  contents: write

concurrency:
  group: crous-alert
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier le fonctionnement du bot
        run: python -m unittest discover -s tests -v
      - name: Rechercher les logements et envoyer les alertes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python main.py --dry-run
          else
            python main.py
          fi
      - name: Sauvegarder les alertes déjà envoyées
        if: ${{ always() && !cancelled() }}
        run: |
          if [ ! -f .state/sent_apartments.json ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/sent_apartments.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Enregistrer les logements déjà signalés'
          git pull --rebase origin main
          git push origin HEAD:main
